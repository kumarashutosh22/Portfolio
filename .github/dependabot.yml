version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "actions"
    open-pull-requests-limit: 5
    reviewers:
      - "kumarashutosh22"
    assignees:
      - "kumarashutosh22"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "npm"
    open-pull-requests-limit: 5
    reviewers:
      - "kumarashutosh22"
    assignees:
      - "kumarashutosh22"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-dependencies:
        patterns:
          - "*"
